<ion-header>
  <ion-toolbar>
    <ion-title>Reportes</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nuevo()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <div *ngIf="loading" class="text-center py-5">
    <ion-spinner></ion-spinner>
  </div>
  <div *ngIf="!loading">
    <p class="text-muted small mb-3">Total: {{ total }} reportes</p>
    <div class="plaga-card mb-2" *ngFor="let r of reportes" (click)="ver(r.id)" style="cursor: pointer;">
      <div class="d-flex align-items-start">
        <img *ngIf="r.imagen_url" [src]="r.imagen_url" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; margin-right: 12px;" />
        <div class="flex-grow-1">
          <h4 class="h6 mb-1">{{ r.titulo }}</h4>
          <p class="small text-muted mb-1">{{ r.estado }} · {{ r.tipo_plaga || 'Sin tipo' }}</p>
          <p class="small mb-0">{{ r.created_at | date:'medium' }}</p>
        </div>
        <ion-icon name="chevron-forward"></ion-icon>
      </div>
    </div>
    <p *ngIf="reportes.length === 0" class="text-muted text-center py-4">No hay reportes. Crea uno desde Inicio o el botón +.</p>
  </div>
</ion-content>
