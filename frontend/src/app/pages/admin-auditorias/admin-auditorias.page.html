<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/home"></ion-back-button>
        </ion-buttons>
        <ion-title>Registro de Auditoría</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="cargarLogs()">
                <ion-icon slot="icon-only" name="refresh"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <div *ngIf="loading" class="text-center py-5">
        <ion-spinner></ion-spinner>
    </div>

    <div *ngIf="error" class="alert alert-danger">
        {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                    <th>Entidad</th>
                    <th>Entidad ID</th>
                    <th>Usuario ID</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let log of logs">
                    <td><small class="text-muted">#{{ log.id }}</small></td>
                    <td style="white-space: nowrap;">{{ log.created_at | date:'short' }}</td>
                    <td><strong>{{ log.accion }}</strong></td>
                    <td><span class="badge bg-secondary">{{ log.entidad || 'N/A' }}</span></td>
                    <td>{{ log.entidad_id || '-' }}</td>
                    <td>{{ log.usuario_id || 'Sistema' }}</td>
                    <td><code>{{ log.ip }}</code></td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="logs.length === 0" class="text-center py-4 text-muted">
            <ion-icon name="document-outline" style="font-size: 48px;"></ion-icon>
            <p>No hay registros de auditoría.</p>
        </div>
    </div>
</ion-content>
